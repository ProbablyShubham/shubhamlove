name: Refresh haevyre.com feed

on:
  schedule:
    - cron: "17 6 1 * *"      # once a month (6:17am UTC on the 1st) — manual runs cover the rest
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest post from RSS
        run: python3 scripts/fetch_feed.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/latest-post.json)" ]]; then
            git config user.name  "feed-bot"
            git config user.email "feed-bot@users.noreply.github.com"
            git add data/latest-post.json
            git commit -m "chore: refresh latest post"
            git push
          else
            echo "No change."
          fi
