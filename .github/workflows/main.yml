name: Refresh portfolio data

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_data.py'
      - '.github/workflows/main.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh cached portfolio data
        run: python3 scripts/update_data.py

      - name: Commit updated data if changed
        run: |
          if git diff --quiet -- data/n2o.json data/latest-post.json; then
            echo 'No data changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/n2o.json data/latest-post.json
          git commit -m 'Refresh portfolio data'
          git push
